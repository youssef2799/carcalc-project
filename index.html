<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Installment Calculator</title>
    <link class="stylesheet" href="task3.css">
    <link rel="stylesheet" href="task3.css">
</head>

<body>
    <div class="calculator-container">
        
        <div class="header">
            <img src="logo.jpg" alt="Logo" class="logo">
            <h1>Car Installment Calculator</h1>
        </div>

        <form class="calculator-form" action="" method="GET">
            <h2>Vehicle and finance data</h2>
            
            <div class="form-group">
                <label for="car-brand">The Brand</label>
                <input list="car-brands-list" id="car-brand" name="car_brand" placeholder="Search or select car brand...">
                <datalist id="car-brands-list">
                    <option value="Toyota">
                    <option value="Gac">
                    <option value="Hyundai">
                    <option value="Kia">
                    <option value="Nissan">
                    <option value="MG">
                    <option value="Chevrolet">
                    <option value="Chery">
                    <option value="Renault">
                    <option value="Mercedes-Benz">
                    <option value="BMW">
                    <option value="Audi">
                    <option value="Volkswagen">
                    <option value="Skoda">
                    <option value="Seat">
                    <option value="Peugeot">
                    <option value="Fiat">
                    <option value="Mitsubishi">
                    <option value="Honda">
                    <option value="Mazda">
                    <option value="Suzuki">
                    <option value="Subaru">
                    <option value="Ford">
                    <option value="Jeep">
                    <option value="BYD">
                    <option value="Geely">
                    <option value="Haval">
                    <option value="Changan">
                    <option value="Jetour">
                    <option value="Baic">
                    <option value="Volvo">
                    <option value="Porsche">
                    <option value="Land Rover">
                </datalist>
            </div>

            <div class="form-group">
                <label for="car-model">Model</label>
                <input list="car-years-list" id="car-model" name="car_model" placeholder="Select or type year (2000 - 2027)...">
                <datalist id="car-years-list">
                    <option value="2027">
                    <option value="2026">
                    <option value="2025">
                    <option value="2024">
                    <option value="2023">
                    <option value="2022">
                    <option value="2021">
                    <option value="2020">
                    <option value="2019">
                    <option value="2018">
                    <option value="2017">
                    <option value="2016">
                    <option value="2015">
                    <option value="2014">
                    <option value="2013">
                    <option value="2012">
                    <option value="2011">
                    <option value="2010">
                    <option value="2009">
                    <option value="2008">
                    <option value="2007">
                    <option value="2006">
                    <option value="2005">
                    <option value="2004">
                    <option value="2003">
                    <option value="2002">
                    <option value="2001">
                    <option value="2000">
                </datalist>
            </div>

            <div class="form-group">
                <label for="price">The Price Of The Car</label>
                <input type="number" id="price" name="price" placeholder="Enter car price" required>
            </div>

            <div class="form-group">
                <label for="downpayment">Downpayment</label>
                <input type="number" id="downpayment" name="downpayment" placeholder="Enter downpayment" required>
            </div>

            <div class="form-group">
                <label for="period">Installment Period (Years)</label>
                <input list="installment-periods" id="period" name="period" placeholder="Select years (1 - 6)..." required>
                <datalist id="installment-periods">
                    <option value="1">
                    <option value="2">
                    <option value="3">
                    <option value="4">
                    <option value="5">
                    <option value="6">
                </datalist>
            </div>

            <input type="submit" value="Calculate Now" class="btn-calculate">
        </form>
    </div>
</body>

</html>
